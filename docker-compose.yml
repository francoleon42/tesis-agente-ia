services:
  postgres_tesis:
    image: postgres:16
    container_name: postgres_tesis
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data_tesis:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n_tesis
    restart: unless-stopped
    ports:
      - "5679:5678"
    environment:
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL}
      - NODE_ENV=production
      - WEBHOOK_URL=${N8N_PROTOCOL}://${N8N_HOST}:5679/
      - GENERIC_TIMEZONE=${TIMEZONE}
    volumes:
      - n8n_data_tesis:/home/node/.n8n
    depends_on:
      postgres_tesis:
        condition: service_healthy

volumes:
  postgres_data_tesis:
  n8n_data_tesis: