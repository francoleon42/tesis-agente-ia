<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat IA</title>

    <!-- 1. Agregamos la librería Marked.js para interpretar Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat {
            width: 100%;
            max-width: 700px;
            height: 90vh;
            background: white;
            display: flex;
            flex-direction: column;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        .header {
            background: #222;
            color: white;
            padding: 12px 18px;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .icono {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
        }

        .mensajes {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .mensaje {
            max-width: 85%; /* Lo agrandé un poquito para que entren mejor las listas */
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        /* 2. Ajustes CSS para que el Markdown se vea bien dentro de la burbuja */
        .mensaje p { margin: 0 0 10px 0; }
        .mensaje p:last-child { margin: 0; }
        .mensaje h3 { margin: 15px 0 5px 0; font-size: 1.1em; color: #111; }
        .mensaje ul, .mensaje ol { margin: 0 0 10px 0; padding-left: 20px; }
        .mensaje blockquote { 
            border-left: 4px solid #ccc; 
            margin: 10px 0; 
            padding-left: 10px; 
            color: #555; 
            font-style: italic; 
        }

        .usuario {
            align-self: flex-end;
            background: #222;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .ia {
            align-self: flex-start;
            background: #e9e9e9;
            color: #222;
            border-bottom-left-radius: 4px;
        }

        .entrada {
            display: flex;
            padding: 15px;
            border-top: 1px solid #ddd;
            gap: 10px;
        }

        .entrada input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 20px;
            font-size: 16px;
            outline: none;
        }

        .entrada input:focus {
            border-color: #555;
        }

        .entrada button {
            border: none;
            background: #222;
            color: white;
            padding: 0 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 15px;
        }

        .entrada button:hover {
            background: #444;
        }

        .entrada button:disabled {
            background: #999;
            cursor: default;
        }
    </style>
</head>
<body>

<div class="chat">
    <div class="header">
        <span>Chat IA</span>
        <img src="icono.jfif" alt="Icono" class="icono">
    </div>

    <div class="mensajes" id="mensajes">
        <div class="mensaje ia">
            ¡Hola! ¿En qué puedo ayudarte?
        </div>
    </div>

    <div class="entrada">
        <input type="text" id="mensaje" placeholder="Escribí un mensaje..." autocomplete="off">
        <button id="boton" onclick="enviarMensaje()">Enviar</button>
    </div>
</div>

<script>
    const URL_API = "http://localhost:5678/webhook-test/c7c5f127-934e-4bd1-ad7f-df7f87f35290";

    const input = document.getElementById("mensaje");
    const boton = document.getElementById("boton");
    const mensajes = document.getElementById("mensajes");

    // 3. Modificamos esta función para que interprete el Markdown
    function agregarMensaje(texto, clase) {
        const elemento = document.createElement("div");
        elemento.className = "mensaje " + clase;

        if (clase === "ia") {
            // Si es la IA, usamos marked.parse para convertir el Markdown a HTML real
            elemento.innerHTML = marked.parse(texto);
        } else {
            // Si es el usuario, usamos textContent por seguridad (evita que el usuario inyecte código)
            elemento.textContent = texto;
        }

        mensajes.appendChild(elemento);
        mensajes.scrollTop = mensajes.scrollHeight;
    }

    async function enviarMensaje() {
        const mensaje = input.value.trim();

        if (!mensaje) {
            return;
        }

        agregarMensaje(mensaje, "usuario");
        input.value = "";
        boton.disabled = true;

        try {
            const respuesta = await fetch(URL_API, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    mensaje: mensaje
                })
            });

            const datos = await respuesta.json();
            
            agregarMensaje(datos.respuesta, "ia");

        } catch (error) {
            agregarMensaje("No se pudo conectar con el servidor.", "ia");
            console.error(error);
        } finally {
            boton.disabled = false;
            input.focus();
        }
    }

    input.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            enviarMensaje();
        }
    });
</script>

</body>
</html>
